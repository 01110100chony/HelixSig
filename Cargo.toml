[package]
name = "helix"
version = "0.1.0"
edition = "2021"
publish = false
description = "A bounded Linux signal-processing experiment with a C++20 kernel"

[dependencies]
cxx = "=1.0.200"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parquet = { version = "56.2", default-features = false }
hdrhistogram = { version = "7.5", default-features = false }
crossbeam-channel = "0.5"

[build-dependencies]
cxx-build = "=1.0.200"
cmake = "=0.1.58"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
panic = "unwind"
