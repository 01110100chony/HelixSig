[package]
name = "helix"
version = "0.1.0"
edition = "2021"
publish = false
description = "A bounded Linux signal-processing experiment with a C++20 kernel"

[dependencies]
cxx = "=1.0.200"

[build-dependencies]
cxx-build = "=1.0.200"
cmake = "=0.1.58"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = false
panic = "unwind"
