name: Helix verification
on: [push, pull_request, workflow_dispatch]
jobs:
  native-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake clang clang-format libclang-rt-18-dev time
      - run: pip install -r requirements.txt
      - run: bash scripts/verify.sh H5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          path: artifacts/
          retention-days: 30
